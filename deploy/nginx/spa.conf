# Static single-page-app server used inside the admin- and study-frontend
# production images. Serves the built React app and falls back to index.html
# for client-side routes.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed build assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths are handled by the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
