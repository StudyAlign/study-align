# ─────────────────────────────────────────────────────────────────────────
#  StudyAlign — one central dev stack.  Replaces the old per-repo compose
#  files and the manual create-network.sh (networks are declared here).
#
#  Usage:
#      cp .env.example .env         # once
#      docker compose up            # db + backend + both frontends
#      docker compose --profile limesurvey up   # ...also LimeSurvey
#
#  Ports (host):  backend 8000 · admin-frontend 3000 · study-frontend 3366
#                 postgres 5433 · limesurvey 8082
# ─────────────────────────────────────────────────────────────────────────

name: studyalign

networks:
  internal:            # backend <-> databases, not exposed
  edge:                # anything the browser / a reverse proxy talks to

volumes:
  database-data:
  limesurvey-mysql:
  admin-node-modules:      # workspace-root node_modules for the admin dev container
  study-node-modules:      # workspace-root node_modules for the study dev container

services:
  database:
    image: postgres:12.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data/
    networks: [internal]

  backend:
    build:
      context: ./apps/backend/backend
    image: studyalign-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      # composed from the DB vars so there is a single source of truth
      SQLALCHEMY_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./apps/backend/backend/app:/app          # live reload of source
    depends_on: [database]
    networks: [internal, edge]

  admin-frontend:
    image: node:18-alpine
    working_dir: /repo                            # workspace root (npm workspaces)
    environment:
      PORT: ${ADMIN_FRONTEND_PORT:-3000}
      REACT_APP_STUDY_ALIGN_URL: http://localhost:${BACKEND_PORT:-8000}
      REACT_APP_STUDY_ALIGN_STUDY_FRONTEND_URL: http://localhost:${STUDY_FRONTEND_PORT:-3366}
      # eslint-config-react-app isn't resolvable under workspace hoisting; lint
      # is run separately, not inside the dev webpack build.
      DISABLE_ESLINT_PLUGIN: "true"
    # install this app + the lib workspace, build the lib, then start the dev server
    command: >
      sh -c "[ -e node_modules/study-align-lib ] ||
             npm install -w study-align-admin-frontend -w study-align-lib --no-package-lock --no-audit --no-fund;
             npm run build:lib;
             npm start -w study-align-admin-frontend"
    ports:
      - "${ADMIN_FRONTEND_PORT:-3000}:${ADMIN_FRONTEND_PORT:-3000}"
    volumes:
      - .:/repo                                   # whole repo (workspaces resolve siblings)
      - admin-node-modules:/repo/node_modules     # hoisted deps, persisted across up/down
    depends_on: [backend]
    networks: [edge]

  study-frontend:
    image: node:18-alpine
    working_dir: /repo                            # workspace root (npm workspaces)
    environment:
      PORT: ${STUDY_FRONTEND_PORT:-3366}
      REACT_APP_STUDY_ALIGN_URL: http://localhost:${BACKEND_PORT:-8000}
      DISABLE_ESLINT_PLUGIN: "true"
    # study-frontend's package name is "study-align-framework"
    command: >
      sh -c "[ -e node_modules/study-align-lib ] ||
             npm install -w study-align-framework -w study-align-lib --no-package-lock --no-audit --no-fund;
             npm run build:lib;
             npm start -w study-align-framework"
    ports:
      - "${STUDY_FRONTEND_PORT:-3366}:${STUDY_FRONTEND_PORT:-3366}"
    volumes:
      - .:/repo                                   # whole repo (workspaces resolve siblings)
      - study-node-modules:/repo/node_modules     # hoisted deps, persisted across up/down
    depends_on: [backend]
    networks: [edge]

  # ── Optional: LimeSurvey (third-party). Start with --profile limesurvey ──
  limesurvey-mysql:
    profiles: ["limesurvey"]
    image: mariadb:10.5.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LIMESURVEY_DB_ROOT_PW:-example}
      MYSQL_DATABASE: limesurvey
      MYSQL_USER: ${LIMESURVEY_DB_USER:-limesurvey_admin}
      MYSQL_PASSWORD: ${LIMESURVEY_DB_PASSWORD:-limesurvey_pass}
    volumes:
      - limesurvey-mysql:/var/lib/mysql
    networks: [internal]

  limesurvey:
    profiles: ["limesurvey"]
    image: martialblog/limesurvey:latest
    restart: unless-stopped
    environment:
      DB_HOST: limesurvey-mysql
      DB_NAME: limesurvey
      DB_USERNAME: ${LIMESURVEY_DB_USER:-limesurvey_admin}
      DB_PASSWORD: ${LIMESURVEY_DB_PASSWORD:-limesurvey_pass}
      ADMIN_USER: ${LIMESURVEY_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${LIMESURVEY_ADMIN_PASSWORD:-password}
      ADMIN_NAME: Lime Administrator
      ADMIN_EMAIL: ${LIMESURVEY_ADMIN_EMAIL:-admin@example.com}
    ports:
      - "8082:80"
    depends_on: [limesurvey-mysql]
    networks: [internal, edge]
