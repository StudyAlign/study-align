server {
	listen 8080;
    location / {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $backend "http://studyctrl-backend:80";

        proxy_pass $backend;
        proxy_redirect off;
        client_max_body_size 50M;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

