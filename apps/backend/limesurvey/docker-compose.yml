version: '3'

networks:
  outside:
    external:
      name: studyctrl-network
  inside:
    driver: bridge

volumes:
  limesurvey-data:

services:
  mysql:
    container_name: limesurvey-mysql
    image:  mariadb:10.5.5
    ports:
      - 3307:3306
    volumes:
     - limesurvey-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: limesurvey
      MYSQL_USER: limesurvey_admin
      MYSQL_PASSWORD: limesurvey_pass
    networks:
      - inside

  limesurvey:
    container_name: limesurvey
    image: martialblog/limesurvey:latest
    ports:
      - 8002:80
    environment:
      DB_HOST: mysql
      DB_NAME: limesurvey
      DB_USERNAME: limesurvey_admin
      DB_PASSWORD: limesurvey_pass
      ADMIN_USER: admin
      ADMIN_PASSWORD: password
      ADMIN_NAME: Lime Administrator
      ADMIN_EMAIL: cashaddy@cashaddy.net
      #PUBLIC_URL: http://localhost:8002/surveys
     # BASE_URL: /surveys
    depends_on:
      - mysql
    networks:
      - inside
      - outside
