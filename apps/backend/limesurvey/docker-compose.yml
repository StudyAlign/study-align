version: '3'

networks:
  outside:
    external:
      name: studyalign-network
  inside:
    driver: bridge

volumes:
  upload:
  mysql:


services:
  mysql:
    container_name: limesurvey-mysql
    image:  mariadb:10.5.8
    ports:
      - 3307:3306
    volumes:
     - mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: limesurvey
      MYSQL_USER: limesurvey_admin
      MYSQL_PASSWORD: limesurvey_pass
    networks:
      - inside

  limesurvey:
    restart: always
    container_name: limesurvey
    image: martialblog/limesurvey:latest
    ports:
      - 8082:80
    environment:
      DB_HOST: mysql
      DB_NAME: limesurvey
      DB_USERNAME: limesurvey_admin
      DB_PASSWORD: limesurvey_pass
      ADMIN_USER: admin
      ADMIN_PASSWORD: password
      ADMIN_NAME: Lime Administrator
      ADMIN_EMAIL: youremail@yourhost
    depends_on:
      - mysql
    networks:
      - inside
      - outside
