version: '3.7'
networks:
  studyctrl-network:
    driver: bridge
volumes:
  database-data:
  limesurvey-data:
services:
  studyctrl-database:
    container_name: studyctrl-database
    image: postgres:12.3-alpine
    env_file:
      - ./database/database.env
    ports:
      - "5433:5432"
    volumes:
      - database-data:/var/lib/postgresql/data/ 
    networks:
      - studyctrl-network
  studyctrl-backend:
    container_name: studyctrl-backend
    build: ./backend
    image: studyctrl-backend
    env_file:
      - ./database/database.env
#    ports:
#      - "8001:80"
    depends_on:
      - database
    networks:
      - studyctrl-network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--debug", "--port", "80", "--reload-dir", "/app"]
    volumes:
      - ./backend/app:/app
  limesurvey-mysql:
    image: mariadb:10.5.5
    volumes:
      - limesurvey-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: limesurvey
      MYSQL_USER: limesurvey_admin
      MYSQL_PASSWORD: limesurvey_pass
    networks:
      - limesurvey-network
  limesurvey:
    image: acspri/limesurvey
    ports:
      - 8002:80
    environment:
      LIMESURVEY_DB_USER: limesurvey_admin
      LIMESURVEY_DB_PASSWORD: limesurvey_pass
      LIMESURVEY_ADMIN_USER: admin
      LIMESURVEY_ADMIN_PASSWORD: password
      LIMESURVEY_ADMIN_NAME: Lime Administrator
      LIMESURVEY_ADMIN_EMAIL: cashaddy@cashaddy.net
    depends_on:
      - mysql
    networks:
      - limesurvey-network
  nginx:
    image: nginx:1.19.0-alpine
    container_name: studyctrl-loadbalancer
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/conf.d/default.conf
#      - ./nginx/error.log:/etc/nginx/error_log.log
#      - ./nginx/cache/:/etc/nginx/cache
#      - /etc/letsencrypt/:/etc/letsencrypt/
    ports:
      - 8080:8080 #backend
      - 8081:8081 #frontend
      - 8082:8082 #limesurvey
      - 443:443
    depends_on:
      - studyctrl-backend
      - limesurvey
    networks:
      - studyctrl-network