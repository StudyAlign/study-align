<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Align Library Example</title>
    <!-- include bundled library -->
    <script src="../dist/study-align-lib-bundle.js"></script>
    <!-- test.js shows the usage of the library's methods -->
   <script type="text/javascript" src="test.js"></script>
</head>
<body>
<h1>Study Align Library</h1>
<p>This index.html is just for testing purposes. It executes the study align library.</p>
<div>
    <button id="refresh">Refresh Tokens</button>
</div>
<div class="buttons">
    <button id="button2">mouseenter (add to bulk)</button>
    <button id="button3">click (add to bulk)</button>
    <button id="button4">click (log directly)</button>
    <button id="button5">Transmit mouse bulk</button>
</div>
<div>
    <input id="textinput" type="text" />
    <button id="keyboardBulkButton">Keyboard Bulk</button>
</div>
<div>
    <canvas id="touchInput" style="width: 500px; height: 500px; background-color: teal"></canvas>
    <button id="touchBulkButton">Touch Bulk</button>
</div>
<div>
    <button id="genericGenerator">Generic Generator</button>
    <button id="genericBulkButton">Generic Event Button</button>
</div>
<div>
    <button id="sseStart">Navigator Start</button>
    <button id="sseReconnect">Navigator Reconnect</button>
</div>
</body>
</html>
