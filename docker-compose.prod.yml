# ─────────────────────────────────────────────────────────────────────────
#  StudyAlign — production stack.
#
#  Served behind Caddy: the three public containers join Caddy's external
#  "web" network and are reached by container name (no published host ports).
#  Postgres stays on the private default network.
#
#  On the server, put this in .env so every `docker compose` call uses it:
#      COMPOSE_FILE=docker-compose.prod.yml
#
#  Subdomains (via deploy/Caddyfile.example):
#      app.studyalign.com      -> study_align_admin_frontend
#      studies.studyalign.com  -> study_align_study_frontend
#      backend.studyalign.com  -> study_align_backend
# ─────────────────────────────────────────────────────────────────────────

name: studyalign

networks:
  default:            # private: backend <-> database
  web:
    external: true    # Caddy's shared network (docker network create web)

volumes:
  # LimeSurvey stores use named volumes (not ./data bind mounts): the upload dir
  # must carry the image's theme/plugin skeleton and be owned by the in-container
  # web user (www-data, uid 33) — a bare bind mount gets neither. Back these up
  # with `docker run --rm -v <vol>:/v busybox tar` (see DEPLOYMENT.md).
  limesurvey-mysql:
  limesurvey-upload:

services:
  database:
    image: postgres:12.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [default]

  study_align_backend:
    build:
      context: ./apps/backend/backend
    image: studyalign-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      SQLALCHEMY_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}
    volumes:
      - ./data/uploads:/app/uploads     # persist group logos, ML models, …
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'true' in urllib.request.urlopen('http://127.0.0.1/health').read() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      database:
        condition: service_healthy
    networks: [default, web]   # web: reached by Caddy as http://study_align_backend

  study_align_admin_frontend:
    build:
      context: .
      dockerfile: deploy/admin-frontend.Dockerfile
      args:
        REACT_APP_STUDY_ALIGN_URL: ${PUBLIC_BACKEND_URL:-https://backend.studyalign.com}
        REACT_APP_STUDY_ALIGN_STUDY_FRONTEND_URL: ${PUBLIC_STUDY_URL:-https://studies.studyalign.com/}
    image: studyalign-admin-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [web]

  study_align_study_frontend:
    build:
      context: .
      dockerfile: deploy/study-frontend.Dockerfile
      args:
        REACT_APP_STUDY_ALIGN_URL: ${PUBLIC_BACKEND_URL:-https://backend.studyalign.com}
    image: studyalign-study-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [web]

  # ── LimeSurvey (surveys.studyalign.com via Caddy) ─────────────────────────
  #  Apache image (self-contained web server) + dedicated MariaDB. The DB stays
  #  on the private "default" network; only LimeSurvey joins "web" for Caddy.
  limesurvey-mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${LIMESURVEY_DB_ROOT_PW}
      MARIADB_DATABASE: limesurvey
      MARIADB_USER: ${LIMESURVEY_DB_USER}
      MARIADB_PASSWORD: ${LIMESURVEY_DB_PASSWORD}
    volumes:
      - limesurvey-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [default]

  study_align_limesurvey:
    # 7.0.15-260910 ships a broken survey editor (its /editor/index.html
    # references build assets that aren't in the image -> 404s). 7.0.13 is the
    # latest tag with a self-consistent editor build. Re-check newer tags later.
    image: martialblog/limesurvey:7.0.13-260903-apache
    restart: unless-stopped
    environment:
      DB_TYPE: mysql
      DB_HOST: limesurvey-mysql
      DB_PORT: 3306
      DB_NAME: limesurvey
      DB_USERNAME: ${LIMESURVEY_DB_USER}
      DB_PASSWORD: ${LIMESURVEY_DB_PASSWORD}
      ADMIN_USER: ${LIMESURVEY_ADMIN_USER}
      ADMIN_PASSWORD: ${LIMESURVEY_ADMIN_PASSWORD}
      ADMIN_NAME: ${LIMESURVEY_ADMIN_NAME:-Lime Administrator}
      ADMIN_EMAIL: ${LIMESURVEY_ADMIN_EMAIL}
      LISTEN_PORT: 80                       # match the stack; Caddy proxies to :80
      PUBLIC_URL: ${LIMESURVEY_PUBLIC_URL:-https://surveys.studyalign.com}
    volumes:
      - limesurvey-upload:/var/www/html/upload
    healthcheck:
      # PHP is always present; curl/wget are not guaranteed in the image.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',80)?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      limesurvey-mysql:
        condition: service_healthy
    networks: [default, web]   # web: reached by Caddy as http://study_align_limesurvey
